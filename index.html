<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tách Nền & Làm Nét Ảnh AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Tách Nền Ảnh AI</h2>
        <p>Chọn ảnh từ máy tính để hệ thống xử lý tự động</p>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p> Nhấn vào đây hoặc chọn ảnh</p>
            <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)" style="display: none;">
        </div>

        <p id="status" class="hidden" style="color: #007bff; font-weight: bold; margin-top: 10px;"></p>
        
        <img id="result-img" class="hidden" alt="Ảnh xem trước" style="max-width: 100%; margin-top: 15px; border-radius: 8px;">
        
        <!-- Hai nút chức năng độc lập -->
        <div class="button-group" style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
            <button id="remove-bg-btn" class="btn hidden" style="background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Tách nền AI</button>
            <button id="sharpen-btn" class="btn hidden" style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Làm nét ảnh</button>
        </div>

        <!-- Nút tải ảnh xuống -->
        <div style="margin-top: 15px; text-align: center;">
            <a id="download-btn" class="btn hidden" href="#" download="processed-image.png" style="background: #22c55e; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; display: inline-block;">Tải ảnh về</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
