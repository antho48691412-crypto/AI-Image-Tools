<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Tools - Tách Nền & Làm Nét Ảnh</title>
    <style>
        /* Thiết kế giao diện tổng thể */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h2 { 
            color: #1f2937; 
            margin-bottom: 8px; 
        }
        
        p.subtitle { 
            color: #4b5563; 
            font-size: 14px; 
            margin-bottom: 20px; 
        }
        
        /* Giao diện khung chọn ảnh nét đứt (Upload Box) */
        .upload-box {
            border: 2px dashed #3b82f6;
            background-color: rgba(59, 130, 246, 0.05);
            padding: 35px 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 15px 0;
        }
        
        .upload-box:hover {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: #1d4ed8;
            transform: translateY(-2px);
        }
        
        .upload-box p {
            margin: 0;
            color: #1d4ed8;
            font-weight: 600;
            font-size: 15px;
        }
        
        .hidden { 
            display: none !important; 
        }
        
        #result-img { 
            max-width: 100%; 
            max-height: 350px;
            border-radius: 8px; 
            margin-top: 15px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); 
        }
        
        /* Nhóm nút bấm chức năng */
        .button-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-1px);
        }
        
        .btn-remove { background: #10b981; }
        .btn-sharpen { background: #3b82f6; }
        .btn-download { 
            background: #22c55e; 
            width: 100%;
            margin-top: 15px;
        }
        
        #status { 
            font-weight: 500; 
            margin-top: 10px; 
            color: #2563eb; 
            font-size: 14px; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tách Nền & Làm Nét Ảnh AI</h2>
        <p class="subtitle">Chọn ảnh từ thiết bị để bắt đầu xử lý</p>
        
        <!-- Khung chọn ảnh dạng kéo thả / bấm vào -->
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>📂 Nhấn vào đây hoặc chọn ảnh để tải lên</p>
            <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)" style="display: none;">
        </div>

        <!-- Trạng thái và khung hiển thị ảnh -->
        <p id="status" class="hidden"></p>
        <img id="result-img" class="hidden" alt="Ảnh xem trước">
        
        <!-- Các nút xử lý ảnh -->
        <div class="button-group">
            <button id="remove-bg-btn" class="btn btn-remove hidden">✨ Tách nền AI</button>
            <button id="sharpen-btn" class="btn btn-sharpen hidden">🔍 Làm nét ảnh</button>
        </div>

        <!-- Nút tải ảnh về máy -->
        <div>
            <button id="download-btn" class="btn btn-download hidden">📥 Tải ảnh về máy</button>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('fileInput');
        const removeBgBtn = document.getElementById('remove-bg-btn');
        const sharpenBtn = document.getElementById('sharpen-btn');
        const downloadBtn = document.getElementById('download-btn');
        const resultImg = document.getElementById('result-img');
        const statusText = document.getElementById('status');

        // 👉 Dán API Key Remove.bg của bạn vào trong cặp dấu nháy kép bên dưới
        const API_KEY = "8JEqXTNbkBPKQRUtQCZErFao";
        let currentProcessedUrl = "";

        // Xử lý khi người dùng chọn ảnh
        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const localUrl = URL.createObjectURL(file);
            resultImg.src = localUrl;
            resultImg.classList.remove('hidden');
            currentProcessedUrl = localUrl;

            removeBgBtn.classList.remove('hidden');
            sharpenBtn.classList.remove('hidden');
            downloadBtn.classList.add('hidden');
            
            statusText.innerText = "Đã chọn ảnh thành công. Hãy chọn tính năng bên dưới!";
            statusText.classList.remove('hidden');
        }

        // 1. Chức năng Tách nền AI (Sử dụng Remove.bg API)
        removeBgBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) return;

            if (API_KEY === "ĐIỀN_API_KEY_REMOVE_BG_CỦA_BẠN_VÀO_ĐÂY") {
                alert("Vui lòng thay thế API Key Remove.bg hợp lệ vào trong code!");
                return;
            }

            statusText.innerText = "Đang tách nền AI, vui lòng đợi trong giây lát...";
            removeBgBtn.disabled = true;

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-Api-Key': API_KEY },
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    currentProcessedUrl = URL.createObjectURL(blob);
                    resultImg.src = currentProcessedUrl;
                    downloadBtn.classList.remove('hidden');
                    statusText.innerText = "Tách nền thành công!";
                } else {
                    const errData = await response.json();
                    alert("Lỗi tách nền: " + (errData.errors?.[0]?.title || "Không xác định"));
                    statusText.innerText = "Tách nền thất bại.";
                }
            } catch (error) {
                console.error(error);
                alert("Lỗi kết nối đến máy chủ.");
                statusText.innerText = "Lỗi kết nối.";
            } finally {
                removeBgBtn.disabled = false;
            }
        });

        // 2. Chức năng Làm nét ảnh (Sử dụng Canvas API với thuật toán Convolution Matrix)
        sharpenBtn.addEventListener('click', () => {
            if (!resultImg.src) return;

            statusText.innerText = "Đang xử lý làm nét ảnh...";

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = resultImg.src;

            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                const w = canvas.width;
                const h = canvas.height;
                
                // Ma trận lọc làm nét (Sharpen Kernel)
                const weights = [
                     0, -1,  0,
                    -1,  5, -1,
                     0, -1,  0
                ];
                
                const outputData = ctx.createImageData(w, h);
                const dst = outputData.data;

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        let r = 0, g = 0, b = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                let px = x + kx;
                                let py = y + ky;
                                if (px >= 0 && px < w && py >= 0 && py < h) {
                                    let idx = (py * w + px) * 4;
                                    let wt = weights[(ky + 1) * 3 + (kx + 1)];
                                    r += data[idx] * wt;
                                    g += data[idx + 1] * wt;
                                    b += data[idx + 2] * wt;
                                }
                            }
                        }
                        let idx = (y * w + x) * 4;
                        dst[idx]     = Math.min(Math.max(r, 0), 255);
                        dst[idx + 1] = Math.min(Math.max(g, 0), 255);
                        dst[idx + 2] = Math.min(Math.max(b, 0), 255);
                        dst[idx + 3] = data[idx + 3]; // Giữ nguyên độ trong suốt (Alpha)
                    }
                }

                ctx.putImageData(outputData, 0, 0);
                currentProcessedUrl = canvas.toDataURL('image/png');
                resultImg.src = currentProcessedUrl;
                downloadBtn.classList.remove('hidden');
                statusText.innerText = "Làm nét ảnh thành công!";
            };
        });

        // 3. Cơ chế tải ảnh về máy tương thích mọi thiết bị (kể cả điện thoại/iPhone)
        downloadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!currentProcessedUrl) return;

            const a = document.createElement('a');
            a.href = currentProcessedUrl;
            a.download = 'ai-processed-image.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
